<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mot de passe oublié — FishGuard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0F1E; --bg-deep:#060910;
    --panel:rgba(18,27,46,0.9); --panel-2:rgba(24,38,66,0.9); --line:#233150;
    --text:#E7ECF6; --muted:#7C8AA8; --safe:#34D399;
    --accent:#5B8CFF; --accent-2:#4FD1FF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; font-family:'Inter',sans-serif; color:var(--text);
    background:
      radial-gradient(1100px 620px at 12% -8%, rgba(91,140,255,0.14), transparent 60%),
      radial-gradient(900px 700px at 108% 15%, rgba(79,209,255,0.09), transparent 55%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    width:100%; max-width:400px; background:var(--panel); border:1px solid var(--line);
    border-radius:16px; padding:36px 32px; backdrop-filter:blur(10px);
    box-shadow:0 20px 50px -30px rgba(0,0,0,0.6);
  }
  .logo-row{display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:24px;}
  .logo-row img{height:52px; width:auto;}
  h1{font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:700; margin:0; text-align:center;}
  .sub{color:var(--muted); font-size:13px; text-align:center; margin-top:4px; line-height:1.5;}
  label{display:block; font-size:12px; color:var(--muted); margin:18px 0 6px; text-transform:uppercase; letter-spacing:0.03em;}
  input{
    width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:9px;
    color:var(--text); padding:11px 12px; font-family:'Inter',sans-serif; font-size:14px;
  }
  input:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent);}
  button{
    width:100%; margin-top:22px; background:linear-gradient(135deg,var(--accent),var(--accent-2));
    color:#07101F; border:none; border-radius:9px; padding:13px; font-weight:700; font-size:14px;
    cursor:pointer;
  }
  .success{
    background:rgba(52,211,153,0.12); border:1px solid rgba(52,211,153,0.4); color:var(--safe);
    border-radius:9px; padding:14px; font-size:13.5px; line-height:1.6; text-align:center;
  }
  .footer-link{text-align:center; margin-top:22px; font-size:13px; color:var(--muted);}
  .footer-link a{color:var(--accent-2); text-decoration:none; font-weight:600;}
  .footer-link a:hover{text-decoration:underline;}
</style>
</head>
<body>
  <div class="card">
    <div class="logo-row">
      <img src="/static/img/logo.png" alt="FishGuard">
      <div>
        <h1>Mot de passe oublié</h1>
        <div class="sub">On vous envoie un lien pour en choisir un nouveau</div>
      </div>
    </div>

    {% if sent %}
    <div class="success">
      Si un compte existe avec cet email, un lien de réinitialisation vient d'être envoyé.
      Vérifiez votre boîte de réception (et vos spams).
    </div>
    {% else %}
    <form method="POST" action="/forgot-password">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autofocus placeholder="vous@exemple.com">
      <button type="submit">Envoyer le lien</button>
    </form>
    {% endif %}

    <div class="footer-link"><a href="/login">&larr; Retour à la connexion</a></div>
  </div>
</body>
</html>
